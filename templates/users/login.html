<!DOCTYPE html>
<html>

<head>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'styles.css' %}">
    <script src="{% static 'js/apiWrapper.js' %}"></script>
    <title>Login</title>
    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                // Step 1: Get the access token from /api/users/token/
                const tokenResponse = await fetch('/api/users/token/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });

                if (!tokenResponse.ok) {
                    const errorData = await tokenResponse.json();
                    alert(`Login failed: ${errorData.error || 'Invalid credentials'}`);
                    return;
                }

                const tokenData = await tokenResponse.json();
                const accessToken = tokenData.access;

                // Step 2: Authenticate the user with /api/users/login/
                const loginResponse = await fetch('/api/users/login/', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json',
                    },
                });

                const loginData = await loginResponse.json();

                if (loginResponse.status === 400 && loginData.error === '2FA code required') {
                    // 2FA is required, redirect to 2FA verification page
                    localStorage.setItem('accessToken', accessToken); // Save token for 2FA verification
                    alert('2FA required. Redirecting to verification page.');
                    window.location.href = '/users/verify-2fa/';
                } else if (loginResponse.ok) {
                    // Login successful
                    alert(`Welcome ${loginData.username}!`);
                    window.location.href = '/products/';
                } else {
                    alert(`Login failed: ${loginData.error || 'Unknown error'}`);
                }
            } catch (error) {
                console.error('Error during login:', error);
                alert('An unexpected error occurred. Please try again.');
            }
        }
    </script>
</head>

<body>
    <div class="auth-container">
        <h2>Login</h2>
        <form onsubmit="handleLogin(event)">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br>
            <button type="submit">Login</button>
        </form>
        <a href="/users/register/">
            <button type="button">Register</button>
        </a>
        <br>
    </div>
</body>

</html>

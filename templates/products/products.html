<!DOCTYPE html>
<html>

<head>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'styles.css' %}">
    <script src="{% static 'js/tokenManager.js' %}"></script>
    <script src="{% static 'js/apiWrapper.js' %}"></script>
    <title>Products</title>
    <script>
        async function fetchProducts() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoryFilter = urlParams.get('category') || ''; // Get the selected category or empty string
            const sort = urlParams.get('sort') || 'price';
            const order = urlParams.get('order') || 'asc';

            try {
                // Construct the query string without including empty parameters
                let apiUrl = `/api/products/products/?ordering=${(order === 'asc' ? '' : '-') + sort}`;
                if (categoryFilter) {
                    apiUrl += `&categories=${categoryFilter}`;
                }

                console.log('Fetching products with URL:', apiUrl); // Debugging

                const response = await apiFetch(apiUrl);

                if (!response.ok) {
                    throw new Error('Failed to fetch products');
                }

                const products = await response.json();
                const productsContainer = document.getElementById('products-container');
                productsContainer.innerHTML = ''; // Clear existing products

                if (products.length === 0) {
                    productsContainer.innerHTML = '<li>No products found.</li>';
                    return;
                }

                products.forEach(product => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                <strong>${product.name}</strong><br>
                ${product.description}<br>
                ${product.price}€<br>
                Categories: ${product.categories.map(c => c.name).join(', ')}<br>
                <form onsubmit="event.preventDefault(); addToCart(${product.id})">
                <label for="quantity-${product.id}">Quantity:</label>
                <input type="number" id="quantity-${product.id}" name="quantity" value="1" min="1">
                <button type="submit">Add to Cart</button>
                </form>
                `;
                    productsContainer.appendChild(li);
                });
            } catch (error) {
                console.error('Error fetching products:', error);
                alert('Error fetching products. Please try again later.');
            }
        }

        async function fetchCategories() {
            try {
                const response = await apiFetch('/api/products/categories/');
                if (!response.ok) {
                    throw new Error('Failed to fetch categories');
                }

                const categories = await response.json();
                const categoryFilter = document.getElementById('category-filter');

                // Populate the dropdown with fetched categories
                categories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category.id;
                    option.textContent = category.name;

                    // Preserve selected value from URL
                    const urlParams = new URLSearchParams(window.location.search);
                    if (urlParams.get('category') === String(category.id)) {
                        option.selected = true;
                    }

                    categoryFilter.appendChild(option);
                });
            } catch (error) {
                console.error('Error fetching categories:', error);
                alert('Failed to load categories. Please try again later.');
            }
        }


        function filterByCategory() {
            const selectedCategory = document.getElementById('category-filter').value;
            const urlParams = new URLSearchParams(window.location.search);

            if (selectedCategory) {
                urlParams.set('category', selectedCategory); // Set the category filter
            } else {
                urlParams.delete('category'); // Remove the category filter if none selected
            }

            window.location.search = urlParams.toString(); // Reload the page with updated parameters
        }

        function sortProducts(criteria, order) {
            const urlParams = new URLSearchParams(window.location.search);

            urlParams.set('sort', criteria);
            urlParams.set('order', order);

            window.location.search = urlParams.toString(); // Reload the page with updated parameters
        }

        async function addToCart(productId) {
            const token = localStorage.getItem('accessToken'); // Retrieve the JWT token
            const quantity = document.getElementById(`quantity-${productId}`).value;

            try {
                // Step 1: Fetch all carts
                const cartResponse = await fetch('/api/carts/carts/?own=true', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`, // Add the JWT token
                    },
                });

                if (!cartResponse.ok) {
                    throw new Error('Failed to retrieve carts');
                }

                const carts = await cartResponse.json();

                // Step 2: Check if the user has an existing cart
                let userCart = carts[0]; // Get the first cart from the list
                if (!userCart) {
                    // No cart exists; create one
                    const createCartResponse = await fetch('/api/carts/carts/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`, // Add the JWT token
                        },
                    });

                    if (!createCartResponse.ok) {
                        throw new Error('Failed to create a new cart');
                    }

                    userCart = await createCartResponse.json(); // Use the newly created cart
                }

                const cartId = userCart.id; // Extract the cart ID

                // Step 3: Add the product to the retrieved or created cart
                const response = await fetch('/api/carts/items/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`, // Add the JWT token
                    },
                    body: JSON.stringify({
                        cart: cartId, // Pass the cart ID explicitly
                        product: productId,
                        quantity: quantity,
                    }),
                });

                if (response.ok) {
                    alert('Product added to cart successfully!');
                } else {
                    const errorData = await response.json();
                    alert(`Error: ${errorData.message || 'Failed to add product to cart'}`);
                }
            } catch (error) {
                console.error('Error adding product to cart:', error);
                alert('An unexpected error occurred. Please try again later.');
            }
        }


        async function logout() {
            try {
                const accessToken = localStorage.getItem('accessToken');
                const refreshToken = localStorage.getItem('refreshToken');

                // Debugging logs
                console.log('Access Token:', accessToken);
                console.log('Refresh Token:', refreshToken);

                if (!refreshToken) {
                    alert('No refresh token found. You may already be logged out.');
                    return;
                }

                const response = await fetch('/api/users/logout/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`,
                    },
                    body: JSON.stringify({ refresh_token: refreshToken }),
                });

                if (response.ok) {
                    // Clear tokens from local storage
                    localStorage.removeItem('accessToken');
                    localStorage.removeItem('refreshToken');

                    alert('Successfully logged out!');
                    window.location.href = '/users/login/';
                } else {
                    const errorData = await response.json();
                    alert(`Logout failed: ${errorData.error || 'Unexpected error'}`);
                }
            } catch (error) {
                console.error('Error logging out:', error);
                alert('An unexpected error occurred during logout. Please try again later.');
            }
        }

        async function fetchUsername() {
            try {
                const response = await apiFetch('/api/users/profiles/?own=true');
                if (!response.ok) {
                    throw new Error('Failed to fetch user data');
                }

                const userProfiles = await response.json();

                // Check if the response contains profiles
                if (!Array.isArray(userProfiles) || userProfiles.length === 0) {
                    throw new Error('No user profile found');
                }

                // Assume the first profile is the relevant one
                const user = userProfiles[0];

                // Update the username display dynamically
                const usernameElement = document.getElementById('logged-in-username');
                usernameElement.textContent = `${user.username}`;

                // Update role dynamically if needed
                const roleElement = document.getElementById('user-role');
                roleElement.textContent = ''; // Clear existing text
                if (user.is_superuser) {
                    roleElement.textContent = '(Admin)';
                } else if (user.is_staff) {
                    roleElement.textContent = '(Staff)';
                } else {
                    roleElement.textContent = '(User)';
                }
            } catch (error) {
                console.error('Error fetching username:', error);
                alert('Failed to load user details. Please try again later.');
            }
        }


        document.addEventListener('DOMContentLoaded', () => {
            fetchCategories();
            fetchProducts();
            fetchUsername();
        });
    </script>
</head>

<body>
    <div class="store-container">
        <p>
            Logged in as <span id="logged-in-username">loading...</span>
            <span id="user-role"></span>
        </p>

        <!-- Navigation Buttons -->
        <div style="margin-bottom: 20px;">
            <button onclick="window.location.href='/cart/'">Go to Cart</button>
            <button onclick="window.location.href='/orders/'">Go to Orders</button>
        </div>

        {% if user.is_superuser or user.is_staff %}
        <div>
        </div>
        {% endif %}

        <h2>Product Overview</h2>

        <!-- Sorting Options -->
        <div>
            <button onclick="sortProducts('name', 'asc')">Sort by Name (A-Z)</button>
            <button onclick="sortProducts('name', 'desc')">Sort by Name (Z-A)</button>
            <button onclick="sortProducts('price', 'asc')">Sort by Price (Low-High)</button>
            <button onclick="sortProducts('price', 'desc')">Sort by Price (High-Low)</button>
        </div>

        <!-- Filter Options -->
        <div>
            <label for="category-filter">Filter by Category:</label>
            <select id="category-filter" onchange="filterByCategory()">
                <option value="">-- All Categories --</option>
                {% for category in all_categories %}
                <option value="{{ category.id }}" {{ category.selected }}>
                    {{ category.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <ul id="products-container"></ul>

        <br>
        {% if not user.profile.two_fa_enabled %}
        <button onclick="window.location.href='/users/setup-2fa/'">Enable/Setup 2FA</button>
        {% endif %}
        <br>
        <button id="logout-button" onclick="logout()">Logout</button>
    </div>
</body>

</html>
